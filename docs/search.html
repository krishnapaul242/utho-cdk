<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Search</title><script src="https://cdn.jsdelivr.net/npm/lunr/lunr.min.js"></script><style>body{font-family:system-ui,Arial,sans-serif;margin:2rem;max-width:900px}input{width:100%;padding:.6rem;font-size:1rem;}li{margin-bottom:.5rem}</style></head><body><h1>Search</h1><input id="q" placeholder="Type to search..." autofocus/><ul id="results"></ul><script>async function init(){const res=await fetch('search-index.json');const docs=await res.json();const idx=lunr(function(){this.ref('id');this.field('title');this.field('content');docs.forEach(d=>this.add(d));});const input=document.getElementById('q');const out=document.getElementById('results');function render(){out.innerHTML='';const q=input.value.trim();if(!q)return;const r=idx.search(q);r.slice(0,30).forEach(hit=>{const doc=docs.find(d=>d.id===hit.ref);const li=document.createElement('li');li.innerHTML='<a href="'+doc.url+'">'+doc.title+'</a><br><small>'+doc.content.slice(0,160)+'...</small>';out.appendChild(li);});}input.addEventListener('input',render);}init();</script></body></html>
