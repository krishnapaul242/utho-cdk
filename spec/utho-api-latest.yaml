        content:
          application/json:
            schema:
              type: object
              example:
                rdns: 255.255.255.255.network.test.com
      parameters:
        - name: cloud_id
          in: path
          schema:
            type: string
          required: true
        - name: ip_address
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/1637583/ip/{public_ip}/delete:
    delete:
      tags:
        - Cloud-Servers
      summary: Delete Public IP
      parameters:
        - name: public_ip
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/enablerescue:
    post:
      tags:
        - Cloud-Servers
      summary: Enable Rescue Mode
      requestBody:
        content: {}
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/disablerescue:
    post:
      tags:
        - Cloud-Servers
      summary: Disable Rescue Mode
      requestBody:
        content: {}
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/mountiso:
    post:
      tags:
        - Cloud-Servers
      summary: Mount ISO
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                iso: windows2012.iso
      parameters:
        - name: cloudid
          in: path
