openapi: 3.0.0
info:
  title: Utho Cloud API
  description: "API for UTHO Cloud"
  version: 1.0.0

produces:
  - application/json

servers:
  - url: https://api.utho.com/v2

components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Please enter your unique API key prefaced by 'Bearer' for access."

security:
  - BearerAuth: []

tags:
  - name: API Key
    description: >-
      Operations related to API keys.
  - name: Account
  - name: Actions
  - name: Activity Logs
  - name: Backups
  - name: DataBase
  - name: DNS
  - name: Cloud-Servers
  - name: Firewalls
  - name: ISO
  - name: Kubernetes
  - name: Load-Balancer
  - name: SQS
  - name: SSH Key
  - name: Snapshots
  - name: SubUser
  - name: Transfer/Recieve Resources
  - name: VPC-old
  - name: VPN
  - name: Autoscaling
  - name: vpc
  - name: vpc > vpc
  - name: vpc > subnets
  - name: vpc > nat-gateway
  - name: vpc > elastic-ip
  - name: vpc > Peering Connection
  - name: vpc > routes
  - name: vpc > internet-gateway
  - name: vpc > route-tables
  - name: Stacks
  - name: SSL
  - name: Object Storage
  - name: Object Storage > Bucket
  - name: Object Storage > Access Keys
  - name: Elastic Block Storage
  - name: Container Registry
  - name: Monitoring & Contacts
  - name: TargetGroup
  - name: IpSec

paths:
  /api:
    get:
      tags:
        - API Key
      summary: API Key List
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}

  /api/generate:
    post:
      tags:
        - API Key
      summary: Add API Key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: my_key
                write: 'on'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/{id}/delete:
    delete:
      tags:
        - API Key
      summary: Delete API Key
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account/info:
    get:
      tags:
        - Account
      summary: Account information
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /actions/{id}:
    get:
      tags:
        - Actions
      summary: Action Detail
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v2/actions/:
    get:
      tags:
        - Actions
      summary: Action list
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /activity:
    get:
      tags:
        - Activity Logs
      summary: Get Activity Logs
      parameters:
        - name: perpage
          in: query
          schema:
            type: integer
          example: '10'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /backups:
    get:
      tags:
        - Backups
      summary: Get Backups
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases:
    get:
      tags:
        - DataBase
      summary: Database Clusters List
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - DataBase
      summary: Add Cluster
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                dcslug: inmumbaizone2
                cpumodel: amd
                cluster_version: '8.0'
                cluster_engine: mysql, mariadb
                size: '10157'
                replica_count: '1'
                network_type: public
                vpc: a222aca0-f435-44e5-aa54-fbd8be2ca7a7
                subnet: a222aca0-f435-44e5-aa54-fbd8be2ca7a7
                firewall: '93'
                cluster_label: utho-aa2owfMR-cluster
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{cluster_id}:
    get:
      tags:
        - DataBase
      summary: Database Cluster Details
      parameters:
        - name: cluster_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}/database:
    post:
      tags:
        - DataBase
      summary: Add Database To Cluster
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: mydatabase
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}/database/{dbname}:
    delete:
      tags:
        - DataBase
      summary: Delete Database from Cluster
      parameters:
        - name: confirm
          in: query
          schema:
            type: string
          example: ':dbname'
        - name: id
          in: path
          schema:
            type: string
          required: true
        - name: dbname
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}/user:
    post:
      tags:
        - DataBase
      summary: Add Database User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: my_user
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{db_id}/user:
    delete:
      tags:
        - DataBase
      summary: Delete Database user
      parameters:
        - name: confirm
          in: query
          schema:
            type: string
          example: ':dbuser_name'
        - name: db_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}/database/{dbname}/user:
    post:
      tags:
        - DataBase
      summary: Update Database Permissions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                db_name: db1
                db_user: user1
                permission: read, full, none
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
        - name: dbname
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}/trustedhost/:
    post:
      tags:
        - DataBase
      summary: Add Trusted Host To Database Cluster
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                trusted_host: 103.234.244.112
                type: add
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}/trustedhost/{trustedhost_ip}:
    delete:
      tags:
        - DataBase
      summary: Delete Trusted Host from Database Cluster
      parameters:
        - name: confirm
          in: query
          schema:
            type: string
          example: ':trustedhost_ip/'
        - name: id
          in: path
          schema:
            type: string
          required: true
        - name: trustedhost_ip
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{db_id}/{cloud_id}/certificate:
    get:
      tags:
        - DataBase
      summary: Download CA Certificate
      parameters:
        - name: db_id
          in: path
          schema:
            type: string
          required: true
        - name: cloud_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{db_id}/backup:
    post:
      tags:
        - DataBase
      summary: Create Backup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                clustername: utho-aa2owfmr-cluster
      parameters:
        - name: db_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{db_id}/securitygroup/{firewall_id}:
    post:
      tags:
        - DataBase
      summary: Add Firewall
      requestBody:
        content: {}
      parameters:
        - name: db_id
          in: path
          schema:
            type: string
          required: true
        - name: firewall_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
        - DataBase
      summary: Detach Firewall
      parameters:
        - name: db_id
          in: path
          schema:
            type: string
          required: true
        - name: firewall_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /databases/{id}:
    delete:
      tags:
        - DataBase
      summary: Delete Database Cluster
      parameters:
        - name: confirm
          in: query
          schema:
            type: string
          example: ':clustername'
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dns:
    get:
      tags:
        - DNS
      summary: DNS List
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dns/{domain}:
    get:
      tags:
        - DNS
      summary: Domains DNS Detail
      parameters:
        - name: domain
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dns/adddomain:
    post:
      tags:
        - DNS
      summary: Add DNS Domain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                domain: mydomain
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dns/{domain}/record/add/:
    post:
      tags:
        - DNS
      summary: Add DNS Record
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                type: '{{A, AAAA, CAA, CNAME, MX, TXT, SRV, NS}}'
                hostname: '{{hostname}}'
                value: '{{value}}'
                ttl: '{{31}}'
                priority: '{{1800}}'
                porttype: '{{for SRV records only. null otherwise}}'
                port: '{{000.00.00.000}}'
                weight: '{{12}}'
      parameters:
        - name: domain
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dns/{domain}/delete:
    delete:
      tags:
        - DNS
      summary: DNS Domain Delete
      parameters:
        - name: domain
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /dns/{domain}/record/{recordid}/delete/:
    delete:
      tags:
        - DNS
      summary: Delete DNS Record
      parameters:
        - name: domain
          in: path
          schema:
            type: string
          required: true
        - name: recordid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/:
    get:
      tags:
        - Cloud-Servers
      summary: List of Cloud Servers
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}:
    get:
      tags:
        - Cloud-Servers
      summary: Detail of Cloud Server
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/deploy/:
    post:
      tags:
        - Cloud-Servers
      summary: Deploy Cloud Instance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                dcslug: inmumbaizone2
                planid: '10045'
                billingcycle: hourly
                auth: option1
                enable_publicip: 'true'
                subnetRequired: 'true'
                firewall: firewall_id
                cpumodel: intel
                enablebackup: 'true'
                root_password: <root_password>
                support: unmanaged
                vpc: 5c1cbe29-74db-4351-a190-93b823793c0a
                cloud:
                  - hostname: my_cloud
                image: ubuntu-22.04-x86_64
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/images:
    get:
      tags:
        - Cloud-Servers
      summary: Available OS Images
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/resizeplans/:
    get:
      tags:
        - Cloud-Servers
      summary: Available Resize Plans
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/snapshot/create/:
    post:
      tags:
        - Cloud-Servers
      summary: Create Snapshot
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: snapshot_name
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/snapshot/{snapshotid}/delete:
    delete:
      tags:
        - Snapshots
      summary: Delete Snapshot
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
        - name: snapshotid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/destroy:
    delete:
      tags:
        - Cloud-Servers
      summary: Destroy
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/backups/disable:
    post:
      tags:
        - Cloud-Servers
      summary: Disable Backup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/backups/enable:
    post:
      tags:
        - Cloud-Servers
      summary: Enable Backup
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/billingcycle:
    post:
      tags:
        - Cloud-Servers
      summary: Update Billing Cycle
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                billingcycle: monthly_or_3month_or_12month
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/hardreboot/:
    post:
      tags:
        - Cloud-Servers
      summary: Hard Reboot
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/powercycle/:
    post:
      tags:
        - Cloud-Servers
      summary: Power Cycle
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/poweroff/:
    post:
      tags:
        - Cloud-Servers
      summary: Power Off
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/poweron/:
    post:
      tags:
        - Cloud-Servers
      summary: Power On
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/rebuild/:
    post:
      tags:
        - Cloud-Servers
      summary: Rebuild
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                image: centos-7.2_x86_64
                confirm: >-
                  I am aware this action will delete data permanently and build
                  a fresh server
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          description: Please enter your unique API key preface by "Bearer" for access
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/resetpassword/:
    post:
      tags:
        - Cloud-Servers
      summary: Reset Password
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/resize/:
    post:
      tags:
        - Cloud-Servers
      summary: Resize
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                type: ramcpu, full
                plan: '10045'
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/snapshot/{snapshotid}/restore/:
    post:
      tags:
        - Cloud-Servers
      summary: Restore Snapshot
      requestBody:
        content: {}
      parameters:

        - name: cloudid
          in: path
          schema:
            type: string
          required: true
        - name: snapshotid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cloud/{cloudid}/storage/{storageid}/update:
    post:
      tags:
        - Cloud-Servers
      summary: Update Storage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                bus: virtio
                type: Primary
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
        - name: storageid
          in: path
          schema:
            type: string
          required: true
