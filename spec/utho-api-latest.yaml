      summary: Unmount ISO
      requestBody:
        content: {}
      parameters:
        - name: cloudid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /firewall:
    get:
      tags:
        - Firewalls
      summary: Firewalls List
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /firewall/{id}:
    get:
      tags:
        - Firewalls
      summary: Firewall Info
      parameters:

        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
